name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布/重发的 tag（如 v1.0.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest

    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 安装 Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "找不到 ISCC.exe：$iscc" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 打安装包
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools/make-installer.ps1 -Iscc $env:ISCC
          if ($LASTEXITCODE -ne 0) { throw "安装包构建失败" }

      - name: 打便携版 zip
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools/make-portable-zip.ps1 -SkipPublish
          if ($LASTEXITCODE -ne 0) { throw "便携版打包失败" }

      - name: 汇总产物
        id: artifacts
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem dist/installer -Filter '*.exe' -ErrorAction SilentlyContinue
          $files += Get-ChildItem dist/installer -Filter '*.sha256.txt' -ErrorAction SilentlyContinue
          $files += Get-ChildItem dist/portable -Filter '*.zip' -ErrorAction SilentlyContinue
          if ($files.Count -eq 0) { throw "没有找到任何产物" }
          $files | ForEach-Object { "  {0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          $list = ($files | ForEach-Object { $_.FullName }) -join "`n"
          "FILES<<EOF`n$list`nEOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: VideoTurner ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.artifacts.outputs.FILES }}
          body: |
            ## 下载

            | 文件 | 说明 |
            |---|---|
            | `*-win-x64-setup.exe` | 安装版，按用户安装、不弹 UAC，带卸载程序 |
            | `*-win-x64-portable.zip` | 便携版，解压即用 |

            两个包都是自包含的，目标机器不需要预装 .NET 8 桌面运行时。
            每个文件旁有 `.sha256.txt`，可用 `Get-FileHash <文件> -Algorithm SHA256` 核对。

            > 无代码签名，首次运行 SmartScreen 会提示「未知发布者」→「更多信息 → 仍要运行」。

            变更内容见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.event.inputs.tag || github.ref_name }}/CHANGELOG.md)。
